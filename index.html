<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmNewsIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#12161c; --sb:#0d1117; --surf:#1a2028; --s2:#161b22; --line:#2a3340;
    --ink:#dfe6ee; --dim:#8c98a8; --faint:#5a6675;
    --acc:#e5a33d; --blue:#2a78d6; --green:#3fa97c; --pur:#7c6af7; --red:#c4453b;
    --glass-bg: 26,32,40; --glass-alpha: .68;
  }
  :root[data-theme="light"]{
    --bg:#f7f7f9; --sb:#ffffff; --surf:#ffffff; --s2:#f0f1f4; --line:#e4e5ea;
    --ink:#181a20; --dim:#5c606c; --faint:#9a9da5;
    --acc:#b5760a; --blue:#2a78d6; --green:#2f8a63; --pur:#7c5cff; --red:#c4453b;
    --glass-bg: 255,255,255; --glass-alpha: .72;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ font: 100%/1.5 'Inter', system-ui, sans-serif; }
  body{ background:var(--bg); color:var(--ink); min-height:100vh; }
  svg.ic{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0; }

  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-track{ background:var(--s2); border-radius:4px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--pur); }

  .page{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:84px; }

  .appbar{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; background:rgba(var(--glass-bg), var(--glass-alpha));
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  }
  .appbar::after{
    content:""; position:absolute; left:0; right:0; bottom:-14px; height:14px; pointer-events:none;
    background:linear-gradient(rgba(var(--glass-bg),.35), transparent);
  }
  .brand-text .name{ font-size:16px; font-weight:800; letter-spacing:-.1px; }
  .brand-text .name b{ color:var(--acc); }
  .brand-text .tag{ font-size:10.5px; color:var(--faint); margin-top:2px; }
  .theme-toggle{
    width:32px; height:32px; border-radius:50%; background:var(--surf); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--dim);
    transition:transform 100ms ease-out;
  }
  .theme-toggle:active{ transform:scale(.88); }

  /* ── Tarjeta reutilizable: IA Summary y cada tarjeta de Resúmenes
     comparten esta misma estructura (label+play arriba, texto abajo
     a todo el ancho, flip para ver fuentes) ──────────────────────── */
  .flip-wrap{ perspective:1400px; }
  .flip-wrap.main{ margin:12px 16px 20px; }
  .flip-wrap.small{ margin-bottom:10px; }
  .flip-inner{ position:relative; transition:transform 480ms cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; }
  .flip-wrap.main .flip-inner{ min-height:220px; }
  .flip-wrap.small .flip-inner{ min-height:150px; }
  .flip-wrap.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; padding:18px; position:relative; overflow:hidden; }
  .flip-wrap.main .face{ padding:20px; border-radius:20px; }
  .face.front{ position:relative; }
  .face.back{ position:absolute; inset:0; transform:rotateY(180deg); display:flex; flex-direction:column; }
  .face-bg{
    background:
      radial-gradient(120% 140% at 100% 0%, #7c6af73d 0%, transparent 55%),
      radial-gradient(120% 140% at 0% 100%, #2a78d62e 0%, transparent 55%),
      var(--surf);
    border:1px solid #7c6af73d;
  }
  .face::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--pur),var(--acc)); z-index:1; }

  .summary-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .summary-label{ font-size:11px; color:var(--pur); font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding-top:4px; }
  .flip-wrap.small .summary-label{ font-size:10px; padding-top:6px; }

  .play-circle{ position:relative; width:44px; height:44px; min-width:44px; border-radius:50%; overflow:hidden; border:2px solid var(--pur); cursor:pointer; transition:transform 100ms ease-out; }
  .flip-wrap.small .play-circle{ width:32px; height:32px; min-width:32px; }
  .play-circle:active{ transform:scale(.9); }
  .play-circle video{ width:100%; height:100%; object-fit:cover; display:block; }
  .play-circle.static{ background:var(--s2); display:flex; align-items:center; justify-content:center; }
  .play-circle.static svg{ stroke:var(--pur); }
  .play-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.32); display:flex; align-items:center; justify-content:center; }
  .play-overlay svg{ stroke:#fff; }

  .card-desc{ font-size:13px; color:var(--dim); line-height:1.62; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
  .flip-wrap.small .card-desc{ font-size:11.5px; -webkit-line-clamp:3; }
  .face-links{ display:flex; align-items:center; gap:14px; margin-top:8px; }
  .link-btn{ font-size:11.5px; color:var(--pur); font-weight:600; cursor:pointer; }
  .flip-wrap.small .link-btn{ font-size:10.5px; }

  .back-title{ font-size:13px; font-weight:700; margin-bottom:4px; }
  .flip-wrap.small .back-title{ font-size:11.5px; }
  .back-sub{ font-size:10.5px; color:var(--faint); margin-bottom:12px; }
  .back-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:9px; padding-right:2px; }
  .back-item{ display:block; text-decoration:none; }
  .back-item .n{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--acc); font-weight:700; margin-right:5px; }
  .back-item .t{ font-size:11.5px; color:var(--ink); font-weight:600; line-height:1.35; }
  .flip-wrap.small .back-item .t{ font-size:10.5px; }
  .back-item .s{ font-size:9.5px; color:var(--faint); margin-top:1px; }
  .back-close{ font-size:11.5px; color:var(--pur); font-weight:600; cursor:pointer; margin-top:12px; align-self:flex-start; }

  /* ── Secciones ────────────────────────────────────────────────────── */
  .sec-header{ margin:0 16px 12px; display:flex; flex-direction:column; gap:10px; }
  .sec-title-row{ display:flex; align-items:center; justify-content:space-between; }
  .sec-header h3{ font-size:17px; font-weight:700; letter-spacing:-.15px; }

  .nav-pills{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .pill-btn{ font-size:11.5px; font-weight:600; padding:6px 14px; border-radius:20px; background:var(--s2); border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap; transition:transform 100ms ease-out, background 150ms, color 150ms; }
  .pill-btn:active{ transform:scale(.95); }
  .pill-btn.active{ background:var(--pur); color:#fff; border-color:var(--pur); }
  .pill-btn.disabled{ opacity:.45; cursor:default; }

  .news-list{ margin:0 16px 12px; }
  .news-row{ display:flex; flex-direction:column; gap:4px; padding:12px 0; border-bottom:1px solid var(--line); text-decoration:none; transition:opacity 100ms ease-out; }
  .news-row:active{ opacity:.6; }
  .news-row:last-child{ border-bottom:none; }
  .news-src{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--dim); font-weight:600; }
  .news-src .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .news-title{ font-size:13.5px; font-weight:600; line-height:1.4; color:var(--ink); }
  .news-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .news-meta .t{ font-size:10.5px; color:var(--faint); }
  .news-tech{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--dim); background:var(--s2); border:1px solid var(--line); border-radius:5px; padding:2px 6px; }
  .empty-note{ color:var(--faint); font-size:12.5px; padding:16px 0; }

  .pagination{ display:flex; align-items:center; justify-content:center; gap:16px; margin:4px 16px 26px; }
  .page-btn{ font-size:11.5px; font-weight:600; color:var(--dim); background:var(--s2); border:1px solid var(--line); border-radius:20px; padding:6px 14px; cursor:pointer; transition:transform 100ms ease-out, opacity 150ms; }
  .page-btn:active{ transform:scale(.95); }
  .page-btn.disabled{ opacity:.35; pointer-events:none; }
  .page-label{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }

  .resumenes-body{ margin:0 16px 28px; }
  .week-day-tag{ font-size:10px; color:var(--faint); margin-bottom:4px; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-title{ font-size:13px; font-weight:700; text-transform:capitalize; }
  .cal-nav{ width:26px; height:26px; border-radius:50%; background:var(--s2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer; font-size:12px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .cal-weekdays span{ text-align:center; font-size:9.5px; color:var(--faint); font-weight:600; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:14px; }
  .cal-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11.5px; color:var(--faint); border-radius:8px; position:relative; }
  .cal-cell.empty{ visibility:hidden; }
  .cal-cell.has-data{ background:var(--s2); color:var(--ink); cursor:pointer; font-weight:600; }
  .cal-cell.has-data:active{ transform:scale(.9); }
  .cal-cell.today{ border:1px solid var(--pur); }
  .cal-cell.selected{ background:var(--pur); color:#fff; }
  .cal-dot{ position:absolute; bottom:3px; width:3px; height:3px; border-radius:50%; background:var(--acc); }
  .cal-cell.selected .cal-dot{ background:#fff; }

  .tabbar{ position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; height:68px; background:var(--sb); border-top:1px solid var(--line); display:flex; padding:8px 4px 14px; z-index:9; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:10px; font-weight:600; cursor:pointer; transition:transform 100ms ease-out, color 150ms; }
  .tab:active{ transform:scale(.92); }
  .tab.active{ color:var(--pur); }

  @media (prefers-reduced-motion: reduce){ * { animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
</style>
</head>
<body>

<div class="page">

  <div class="appbar">
    <div class="brand-text">
      <div class="name">Am<b>News</b>IA</div>
      <div class="tag" id="brandTag">Tu Briefing diario</div>
    </div>
    <div class="theme-toggle" id="themeToggle"></div>
  </div>

  <div id="heroMount"></div>

  <div class="sec-header" id="secNoticias">
    <div class="sec-title-row"><h3>Noticias</h3></div>
    <div class="nav-pills">
      <button class="pill-btn active" id="pillHoy">Hoy</button>
      <button class="pill-btn disabled" title="Próximamente">Semana</button>
      <button class="pill-btn disabled" title="Próximamente">Mensual</button>
      <button class="pill-btn disabled" title="Próximamente">Historial</button>
    </div>
  </div>
  <div class="news-list" id="newsList"></div>
  <div class="pagination" id="pagination"></div>

  <div class="sec-header" id="secResumenes">
    <div class="sec-title-row"><h3>Resúmenes</h3></div>
    <div class="nav-pills">
      <button class="pill-btn active" id="pillSemanal" onclick="setResView('semanal')">Semanal</button>
      <button class="pill-btn" id="pillMensual" onclick="setResView('mensual')">Mensual</button>
      <button class="pill-btn" id="pillHistorial" onclick="setResView('historial')">Historial</button>
    </div>
  </div>
  <div class="resumenes-body" id="resumenesBody"></div>

  <div class="tabbar">
    <div class="tab active" id="tabInicio"><div id="tabIconInicio"></div>Inicio</div>
    <div class="tab" id="tabNoticias"><div id="tabIconNoticias"></div>Noticias</div>
    <div class="tab" id="tabResumenes"><div id="tabIconResumenes"></div>Resúmenes</div>
  </div>

</div>

<audio id="briefingAudio"></audio>

<script>
const ICONS = {
  home:       `<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>`,
  newspaper:  `<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/>`,
  headphones: `<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.4"/><rect x="17" y="14" width="4" height="6" rx="1.4"/>`,
  play:       `<path d="M9 7l8 5-8 5V7z"/>`,
  pause:      `<path d="M9 7v10M15 7v10"/>`,
  sun:        `<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>`,
  moon:       `<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>`,
};
function icon(name, size = 18) {
  return `<svg class="ic" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${ICONS[name]}</svg>`;
}

const CAT_COLOR = {
  "Modelos":"var(--pur)", "Investigación":"var(--green)",
  "Herramientas":"var(--acc)", "Industria":"var(--blue)", "Videos":"var(--red)",
};
const PAGE_SIZE = 10;
const DAY_NAMES = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MONTH_ABBR = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

let DATA = null;
let newsPage = 0;

function stripMarkdown(text){
  return (text || "").replace(/\*\*(.*?)\*\*/g, "$1").replace(/\*(.*?)\*/g, "$1").trim();
}

function renderChrome(){
  document.getElementById("themeToggle").innerHTML = icon('moon', 15);
  document.getElementById("tabIconInicio").innerHTML = icon('home', 19);
  document.getElementById("tabIconNoticias").innerHTML = icon('newspaper', 19);
  document.getElementById("tabIconResumenes").innerHTML = icon('headphones', 19);
}

/* ══════════════════════════════════════════════════════════════════
   Tarjeta reutilizable (flip): la usa el IA Summary principal y cada
   tarjeta de Resúmenes -- misma estructura, solo cambia si lleva
   video real o un ícono estático, y el tamaño (main / small).
   ══════════════════════════════════════════════════════════════════ */
let cardRegistry = {}; // id -> { audioUrl } para wiring de play/pause

function buildCardHTML(id, { size, label, text, audioUrl, sources, playVideo }){
  const playInner = playVideo
    ? `<video src="welcome-video.mp4" muted loop autoplay playsinline></video><div class="play-overlay" id="${id}-icon">${icon('play', size==='main'?15:12)}</div>`
    : `<div class="play-overlay" id="${id}-icon" style="position:static;background:none;">${icon('play', size==='main'?15:12)}</div>`;

  const sourcesHtml = (sources && sources.length)
    ? sources.map((a, i) => `
        <a class="back-item" href="${a.url}" target="_blank" rel="noopener">
          <span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${a.title}</span>
          <div class="s">${a.source} · ${a.time}</div>
        </a>`).join("")
    : `<p style="color:var(--faint); font-size:11px;">Sin fuentes registradas.</p>`;

  cardRegistry[id] = { audioUrl };

  return `
    <div class="flip-wrap ${size}" id="${id}-wrap">
      <div class="flip-inner">
        <div class="face front face-bg">
          <div class="summary-top">
            <div class="summary-label">${label}</div>
            <div class="play-circle ${playVideo ? '' : 'static'}" id="${id}-playbtn" onclick="toggleCardAudio('${id}')">${playInner}</div>
          </div>
          <div class="card-desc" id="${id}-desc">${text}</div>
          <div class="face-links">
            <span class="link-btn" onclick="toggleCardExpand('${id}')" id="${id}-more">Ver más</span>
            <span class="link-btn" onclick="flipCardEl('${id}', true)">Ver fuentes →</span>
          </div>
        </div>
        <div class="face back face-bg">
          <div class="back-title">Fuentes</div>
          <div class="back-sub">Artículos usados en este resumen</div>
          <div class="back-list">${sourcesHtml}</div>
          <span class="back-close" onclick="flipCardEl('${id}', false)">← Volver</span>
        </div>
      </div>
    </div>
  `;
}

function toggleCardExpand(id){
  const el = document.getElementById(`${id}-desc`);
  const btn = document.getElementById(`${id}-more`);
  const expanded = el.style.webkitLineClamp === "unset";
  if (expanded){
    el.style.webkitLineClamp = "";
    btn.textContent = "Ver más";
  } else {
    el.style.webkitLineClamp = "unset";
    btn.textContent = "Ver menos";
  }
}

function flipCardEl(id, toBack){
  document.getElementById(`${id}-wrap`).classList.toggle("flipped", toBack);
}

let activeAudioId = null;
function toggleCardAudio(id){
  const entry = cardRegistry[id];
  if (!entry || !entry.audioUrl) return;

  if (activeAudioId === id && !briefingAudio.paused){
    briefingAudio.pause();
    return;
  }
  if (activeAudioId && activeAudioId !== id) setIconState(activeAudioId, false);
  activeAudioId = id;
  briefingAudio.src = entry.audioUrl;
  briefingAudio.play().catch(()=>{});
}
function setIconState(id, playing){
  const el = document.getElementById(`${id}-icon`);
  if (el) el.innerHTML = icon(playing ? 'pause' : 'play', document.getElementById(`${id}-wrap`)?.classList.contains('main') ? 15 : 12);
}

const briefingAudio = document.getElementById("briefingAudio");
briefingAudio.addEventListener("play", () => { if (activeAudioId) setIconState(activeAudioId, true); });
briefingAudio.addEventListener("pause", () => { if (activeAudioId) setIconState(activeAudioId, false); });
briefingAudio.addEventListener("ended", () => { if (activeAudioId) setIconState(activeAudioId, false); });

/* ── IA Summary principal ─────────────────────────────────────────── */
function renderHero(){
  const clean = stripMarkdown(DATA.briefing.script_text) || "Todavía no hay un resumen generado para hoy.";
  const rss = DATA.articles.filter(a => a.source_type === "rss").slice(0, 10);
  document.getElementById("heroMount").innerHTML = buildCardHTML("hero", {
    size:"main", label:"IA Summary", text:clean,
    audioUrl:DATA.briefing.audio_url, sources:rss, playVideo:true,
  });

  const d = DATA.date.split("-");
  document.getElementById("brandTag").textContent =
    `Tu Briefing diario · ${parseInt(d[2],10)} ${MONTH_ABBR[parseInt(d[1],10)-1]} ${d[0]}`;
}

function renderNewsPage(){
  const rss = DATA.articles.filter(a => a.source_type === "rss");
  const totalPages = Math.max(1, Math.ceil(rss.length / PAGE_SIZE));
  newsPage = Math.min(newsPage, totalPages - 1);
  const slice = rss.slice(newsPage * PAGE_SIZE, newsPage * PAGE_SIZE + PAGE_SIZE);

  const box = document.getElementById("newsList");
  box.innerHTML = slice.length ? slice.map(a => `
    <a class="news-row" href="${a.url}" target="_blank" rel="noopener">
      <div class="news-src"><span class="dot" style="background:${CAT_COLOR[a.cat]||'var(--dim)'}"></span>${a.source}</div>
      <span class="news-title">${a.title}</span>
      <div class="news-meta"><span class="t">Hace ${a.time}</span><span class="news-tech">${a.cat}</span></div>
    </a>
  `).join("") : `<div class="empty-note">Sin noticias nuevas por ahora.</div>`;

  document.getElementById("pagination").innerHTML = `
    <div class="page-btn ${newsPage === 0 ? 'disabled' : ''}" onclick="changePage(-1)">← Anterior</div>
    <div class="page-label">Página ${newsPage + 1} de ${totalPages}</div>
    <div class="page-btn ${newsPage >= totalPages - 1 ? 'disabled' : ''}" onclick="changePage(1)">Siguiente →</div>
  `;
}
function changePage(delta){
  newsPage += delta;
  renderNewsPage();
  document.getElementById("newsList").scrollIntoView({behavior:"smooth", block:"start"});
}

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  document.getElementById("themeToggle").innerHTML = icon(next === "dark" ? 'moon' : 'sun', 15);
}
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

function scrollToSection(tabId, sectionId){
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  if (sectionId) document.getElementById(sectionId).scrollIntoView({behavior:"smooth", block:"start"});
  else window.scrollTo({top:0, behavior:"smooth"});
}
document.getElementById("tabInicio").addEventListener("click", () => scrollToSection("tabInicio", null));
document.getElementById("tabNoticias").addEventListener("click", () => scrollToSection("tabNoticias", "secNoticias"));
document.getElementById("tabResumenes").addEventListener("click", () => scrollToSection("tabResumenes", "secResumenes"));

/* ══════════════════════════════════════════════════════════════════
   Resúmenes: Semanal / Mensual / Historial -- misma tarjeta reutilizable
   ══════════════════════════════════════════════════════════════════ */
let historyIndex = null;
async function loadHistoryIndex(){
  if (historyIndex) return historyIndex;
  try {
    const res = await fetch("data/history/index.json");
    historyIndex = res.ok ? await res.json() : [];
  } catch(e){ historyIndex = []; }
  return historyIndex;
}
async function fetchDayDetail(dateStr){
  try {
    const res = await fetch(`data/history/${dateStr}.json`);
    return res.ok ? await res.json() : null;
  } catch(e){ return null; }
}
function fmtDateISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getMonday(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const m = new Date(d); m.setDate(d.getDate() + diff); m.setHours(0,0,0,0);
  return m;
}

function dayCardHTML(id, dateLabel, detail){
  const clean = stripMarkdown(detail.briefing.script_text) || "Sin resumen disponible.";
  const sources = (detail.articles || []).filter(a => a.source_type === "rss").slice(0, 10);
  return `<div class="week-day-tag">${dateLabel}</div>` + buildCardHTML(id, {
    size:"small", label:"Resumen", text:clean,
    audioUrl:detail.briefing.audio_url, sources, playVideo:false,
  });
}

async function renderSemanal(){
  const box = document.getElementById("resumenesBody");
  box.innerHTML = `<p style="color:var(--faint); font-size:12px; padding:8px 0;">Cargando la semana…</p>`;

  const index = await loadHistoryIndex();
  const byDate = Object.fromEntries(index.map(e => [e.date, e]));
  const monday = getMonday(new Date());
  const days = Array.from({length:7}).map((_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });

  const cards = await Promise.all(days.map(async (d) => {
    const dateStr = fmtDateISO(d);
    const label = `${DAY_NAMES[d.getDay() === 0 ? 6 : d.getDay() - 1]} ${d.getDate()}`;
    if (!byDate[dateStr]) return "";
    const detail = await fetchDayDetail(dateStr);
    return detail ? dayCardHTML(`day-${dateStr}`, label, detail) : "";
  }));

  const filled = cards.filter(Boolean);
  box.innerHTML = filled.length ? filled.join("") : `<p style="color:var(--faint); font-size:12px;">Todavía no hay resúmenes esta semana.</p>`;
}

let calYear, calMonth;
function buildCalendarHTML(year, month, availableSet, navigable, detailBoxId){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() === 0 ? 6 : first.getDay() - 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = fmtDateISO(new Date());

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const has = availableSet.has(dateStr);
    const isToday = dateStr === todayStr;
    cells += `<div class="cal-cell ${has ? 'has-data' : ''} ${isToday ? 'today' : ''}" ${has ? `onclick="onCalendarDayClick('${dateStr}','${detailBoxId}')"` : ""}>${day}${has ? '<span class="cal-dot"></span>' : ''}</div>`;
  }

  return `
    <div class="cal-header">
      ${navigable ? `<div class="cal-nav" onclick="changeCalMonth(-1)">←</div>` : `<div style="width:26px"></div>`}
      <div class="cal-title">${MONTH_NAMES[month]} ${year}</div>
      ${navigable ? `<div class="cal-nav" onclick="changeCalMonth(1)">→</div>` : `<div style="width:26px"></div>`}
    </div>
    <div class="cal-weekdays">${DAY_NAMES.map(d => `<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div id="${detailBoxId}"><p style="color:var(--faint); font-size:11.5px;">Toca un día con datos para verlo.</p></div>
  `;
}

async function onCalendarDayClick(dateStr, detailBoxId){
  const box = document.getElementById(detailBoxId);
  box.innerHTML = `<p style="color:var(--faint); font-size:11.5px;">Cargando…</p>`;
  document.querySelectorAll(".cal-cell.has-data").forEach(c => c.classList.remove("selected"));
  const cell = [...document.querySelectorAll(".cal-cell.has-data")].find(c => c.getAttribute("onclick")?.includes(`'${dateStr}'`));
  if (cell) cell.classList.add("selected");

  const detail = await fetchDayDetail(dateStr);
  box.innerHTML = detail ? dayCardHTML(`cal-${dateStr}`, detail.date_label, detail)
                          : `<p style="color:var(--faint); font-size:11.5px;">No se pudo cargar este día.</p>`;
}

async function renderMensual(){
  const box = document.getElementById("resumenesBody");
  const index = await loadHistoryIndex();
  const availableSet = new Set(index.map(e => e.date));
  const now = new Date();
  box.innerHTML = buildCalendarHTML(now.getFullYear(), now.getMonth(), availableSet, false, "calDayDetail");
}
async function renderHistorial(){
  const box = document.getElementById("resumenesBody");
  const index = await loadHistoryIndex();
  const availableSet = new Set(index.map(e => e.date));
  if (calYear === undefined){ const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth(); }
  box.innerHTML = buildCalendarHTML(calYear, calMonth, availableSet, true, "calDayDetailHist");
}
function changeCalMonth(delta){
  calMonth += delta;
  if (calMonth < 0){ calMonth = 11; calYear--; }
  if (calMonth > 11){ calMonth = 0; calYear++; }
  renderHistorial();
}

function setResView(view){
  ["Semanal","Mensual","Historial"].forEach(v => document.getElementById(`pill${v}`).classList.toggle("active", v.toLowerCase() === view));
  if (view === "semanal") renderSemanal();
  if (view === "mensual") renderMensual();
  if (view === "historial") renderHistorial();
}

renderChrome();
fetch("data/news.json")
  .then(r => r.json())
  .then(json => { DATA = json; renderHero(); renderNewsPage(); setResView("semanal"); })
  .catch(err => {
    document.querySelector(".page").innerHTML =
      `<p style="padding:40px 20px;color:var(--dim)">No se pudo cargar data/news.json. Revisa que el sitio se esté sirviendo por HTTP.</p>`;
    console.error(err);
  });
</script>
